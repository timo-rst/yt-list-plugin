<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <style>
      .bg { fill: #0f0f0f; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #f1f1f1; }
      .btn-pill { fill: rgba(255, 255, 255, 0.1); stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; rx: 18px; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #f1f1f1; }
      .card-bg { fill: rgba(255, 255, 255, 0.03); rx: 12px; }
      .video-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #f1f1f1; }
      .video-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13.5px; fill: #aaaaaa; }
      .video-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13.5px; fill: #888888; }
      .badge-time { fill: rgba(0, 0, 0, 0.85); rx: 4px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
      .avatar-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <linearGradient id="thumbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="thumbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="thumbGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="avGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="avGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="avGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" class="bg"/>

  <!-- Top Navigation / Header Bar -->
  <g transform="translate(60, 36)">
    <!-- Section Title -->
    <text x="0" y="24" class="header-title">Latest</text>

    <!-- Custom On-Page Switch Button (Action: Grid) -->
    <g transform="translate(860, 0)">
      <rect width="105" height="36" class="btn-pill"/>
      <!-- Grid 4-square icon -->
      <g transform="translate(14, 10)" fill="#f1f1f1">
        <rect x="0" y="0" width="6.5" height="6.5" rx="1"/>
        <rect x="8.5" y="0" width="6.5" height="6.5" rx="1"/>
        <rect x="0" y="8.5" width="6.5" height="6.5" rx="1"/>
        <rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1"/>
      </g>
      <text x="38" y="23" class="btn-text">Grid</text>
    </g>

    <!-- Native Manage Button -->
    <g transform="translate(980, 0)">
      <rect width="100" height="36" class="btn-pill"/>
      <text x="24" y="23" class="btn-text">Manage</text>
    </g>
  </g>

  <!-- Video List Item 1 -->
  <g transform="translate(60, 96)">
    <rect width="1080" height="156" class="card-bg"/>

    <!-- Thumbnail -->
    <g transform="translate(16, 16)">
      <rect width="220" height="124" rx="8" fill="url(#thumbGrad1)"/>
      <!-- Play icon overlay -->
      <circle cx="110" cy="62" r="22" fill="rgba(0,0,0,0.5)"/>
      <polygon points="105,52 120,62 105,72" fill="#ffffff"/>
      <!-- Duration Badge -->
      <rect x="168" y="96" width="44" height="20" class="badge-time"/>
      <text x="174" y="111" class="badge-text">14:22</text>
    </g>

    <!-- Content Column -->
    <g transform="translate(256, 24)">
      <!-- Channel Avatar -->
      <circle cx="18" cy="18" r="18" fill="url(#avGrad1)"/>
      <text x="18" y="18" class="avatar-text">TC</text>

      <!-- Video Details -->
      <g transform="translate(48, 0)">
        <text x="0" y="15" class="video-title">Building Modern Web Applications with Clean Architecture &amp; TypeScript</text>
        <text x="0" y="38" class="video-meta">Tech &amp; Code • 42K views • 2 hours ago</text>
        <text x="0" y="66" class="video-desc">In this comprehensive guide, we explore building scalable and maintainable applications using modular</text>
        <text x="0" y="86" class="video-desc">architecture patterns, separation of concerns, and clean dependency management...</text>
      </g>
    </g>

    <!-- 3-Dots Menu Icon -->
    <g transform="translate(1048, 28)" fill="#aaaaaa">
      <circle cx="6" cy="6" r="2.2"/>
      <circle cx="6" cy="14" r="2.2"/>
      <circle cx="6" cy="22" r="2.2"/>
    </g>
  </g>

  <!-- Video List Item 2 -->
  <g transform="translate(60, 272)">
    <rect width="1080" height="156" class="card-bg"/>

    <!-- Thumbnail -->
    <g transform="translate(16, 16)">
      <rect width="220" height="124" rx="8" fill="url(#thumbGrad2)"/>
      <circle cx="110" cy="62" r="22" fill="rgba(0,0,0,0.5)"/>
      <polygon points="105,52 120,62 105,72" fill="#ffffff"/>
      <rect x="168" y="96" width="44" height="20" class="badge-time"/>
      <text x="174" y="111" class="badge-text">28:15</text>
    </g>

    <!-- Content Column -->
    <g transform="translate(256, 24)">
      <circle cx="18" cy="18" r="18" fill="url(#avGrad2)"/>
      <text x="18" y="18" class="avatar-text">WD</text>

      <g transform="translate(48, 0)">
        <text x="0" y="15" class="video-title">Wild Planet: Exploring Deep Ocean Trenches in Ultra HD 4K</text>
        <text x="0" y="38" class="video-meta">World Documentaries • 128K views • 5 hours ago</text>
        <text x="0" y="66" class="video-desc">Join us on an unprecedented expedition into the deepest marine trenches on Earth. Discover extraordinary</text>
        <text x="0" y="86" class="video-desc">bioluminescent creatures and geothermal ecosystems thriving under extreme pressure...</text>
      </g>
    </g>

    <g transform="translate(1048, 28)" fill="#aaaaaa">
      <circle cx="6" cy="6" r="2.2"/>
      <circle cx="6" cy="14" r="2.2"/>
      <circle cx="6" cy="22" r="2.2"/>
    </g>
  </g>

  <!-- Video List Item 3 -->
  <g transform="translate(60, 448)">
    <rect width="1080" height="156" class="card-bg"/>

    <!-- Thumbnail -->
    <g transform="translate(16, 16)">
      <rect width="220" height="124" rx="8" fill="url(#thumbGrad3)"/>
      <circle cx="110" cy="62" r="22" fill="rgba(0,0,0,0.5)"/>
      <polygon points="105,52 120,62 105,72" fill="#ffffff"/>
      <rect x="168" y="96" width="44" height="20" class="badge-time"/>
      <text x="174" y="111" class="badge-text">08:45</text>
    </g>

    <!-- Content Column -->
    <g transform="translate(256, 24)">
      <circle cx="18" cy="18" r="18" fill="url(#avGrad3)"/>
      <text x="18" y="18" class="avatar-text">SD</text>

      <g transform="translate(48, 0)">
        <text x="0" y="15" class="video-title">The Physics of Black Holes: What Actually Happens at the Event Horizon?</text>
        <text x="0" y="38" class="video-meta">Science Daily • 85K views • 1 day ago</text>
        <text x="0" y="66" class="video-desc">Delving into the boundary of space-time where gravity becomes infinite. We examine general relativity,</text>
        <text x="0" y="86" class="video-desc">Hawking radiation, and quantum entanglement puzzles at the cosmic frontier...</text>
      </g>
    </g>

    <g transform="translate(1048, 28)" fill="#aaaaaa">
      <circle cx="6" cy="6" r="2.2"/>
      <circle cx="6" cy="14" r="2.2"/>
      <circle cx="6" cy="22" r="2.2"/>
    </g>
  </g>
</svg>
